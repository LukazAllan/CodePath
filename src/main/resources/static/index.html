<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePath</title>
    <!-- O caminho começa com '/' porque o Spring serve a pasta 'static' como a raiz do site -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main id="app-root">
        <!-- O conteúdo dinâmico da aplicação (nossas Views) será renderizado aqui -->
    </main>

    <footer>
        <p>&copy; 2026 CodePath</p>
    </footer>

    <!-- 'type="module"' é crucial para podermos usar 'import' e 'export' nos nossos arquivos JS -->
    <script src="/js/main.js" type="module"></script>
</body>
</html>
